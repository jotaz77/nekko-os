<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Impressão OS</title>

    <link rel="stylesheet" href="print.css">

</head>

<body>

<div class="receipt">

    <header>

        <h1 id="companyName">EMPRESA</h1>

        <p id="storeName">Loja</p>

        <p id="storePhone">WhatsApp</p>

    </header>

    <hr>

    <section>

        <h2>ORDEM DE SERVIÇO</h2>

        <div class="row">
            <span>OS</span>
            <span id="osNumber"></span>
        </div>

        <div class="row">
            <span>Data</span>
            <span id="createdAt"></span>
        </div>

    </section>

    <hr>

    <section>

        <h2>CLIENTE</h2>

        <p id="customerName"></p>
        <p id="customerPhone"></p>

    </section>

    <hr>

    <section>

    <h2>APARELHO</h2>

        <p id="deviceType"></p>
    
        <p id="deviceBrand"></p>
    
        <p id="deviceModel"></p>
    
        <div id="deviceLockContainer"></div>
    
    </section>

    <hr>

    <section>

        <h2>DEFEITO</h2>

        <p id="reportedProblem"></p>

    </section>

    <hr>

    <section>

        <h2>OBSERVAÇÕES</h2>

        <p id="observations"></p>

    </section>

    <hr>

    <section>

        <h2>SERVIÇO</h2>

        <p id="serviceName"></p>

        <p class="total">
            <strong>Valor:</strong>
            <span id="servicePrice"></span>
        </p>

    </section>

    <hr>

    <section>

        <p>

            Declaro que entreguei este aparelho para avaliação e/ou manutenção.

        </p>

        <br><br><br>

        <div class="signature">

            _______________________________

            <br>

            Assinatura do Cliente

        </div>

    </section>

    <hr>

    <footer>

        <p>

            Impresso em

        </p>

        <p id="printedAt"></p>

        <strong>NEKKO OS</strong>

    </footer>

</div>

<!-- Scripts -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../../assets/js/config.js"></script>
<script>
console.log("CONFIG:", typeof SUPABASE_URL);
</script>

<script src="../../assets/js/supabase.js"></script>
<script>
console.log("SUPABASE:", typeof Supabase);
</script>

<script src="../../assets/js/storage.js"></script>
<script>
console.log("STORAGE:", typeof Storage);
</script>

<script src="../../assets/js/auth.js"></script>
<script>
console.log("AUTH:", typeof Auth);
</script>

<script src="../../assets/js/api.js"></script>
<script>
console.log("API:", typeof Api);
</script>

<script src="../../assets/js/bootstrap.js"></script>
<script>
console.log("BOOTSTRAP:", typeof Bootstrap);
</script>

<script src="../../assets/js/roles.js"></script>

<script src="print.js"></script>

</body>
</html>

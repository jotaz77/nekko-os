<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <link
        rel="icon"
        type="image/png"
        href="../../assets/img/nekkologo_favicon.png"
    >

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEKKO OS | Ordens de Serviço</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body
    class="
        bg-[#070A08]
        text-white
        min-h-screen
        overflow-x-hidden
    "
>

    <!-- ========================================= -->
    <!-- FUNDO -->
    <!-- ========================================= -->

    <div
        class="
            fixed
            inset-0
            pointer-events-none
            opacity-40
        "
    >

        <div
            class="
                absolute
                -top-48
                -left-40
                w-[560px]
                h-[560px]
                rounded-full
                bg-green-500/5
                blur-3xl
            "
        ></div>


        <div
            class="
                absolute
                top-1/3
                -right-48
                w-[500px]
                h-[500px]
                rounded-full
                bg-emerald-400/5
                blur-3xl
            "
        ></div>


        <div
            class="
                absolute
                inset-0
                opacity-20
            "
            style="
                background-image:
                    linear-gradient(
                        rgba(255,255,255,0.025) 1px,
                        transparent 1px
                    ),
                    linear-gradient(
                        90deg,
                        rgba(255,255,255,0.025) 1px,
                        transparent 1px
                    );
                background-size: 42px 42px;
            "
        ></div>

    </div>



    <!-- ========================================= -->
    <!-- CONTEÚDO -->
    <!-- ========================================= -->

    <main
        class="
            relative
            z-10
            max-w-7xl
            mx-auto
            px-5
            md:px-8
            py-8
            md:py-10
        "
    >


        <!-- ===================================== -->
        <!-- HEADER -->
        <!-- ===================================== -->

        <header
            class="
                flex
                flex-col
                lg:flex-row
                lg:items-end
                lg:justify-between
                gap-6
                mb-8
            "
        >

            <div>

                <div
                    class="
                        inline-flex
                        items-center
                        gap-2
                        px-3
                        py-1.5
                        rounded-full
                        border
                        border-green-500/15
                        bg-green-500/5
                        text-green-400
                        text-xs
                        font-semibold
                        uppercase
                        tracking-[0.18em]
                        mb-4
                    "
                >

                    <i
                        data-lucide="clipboard-list"
                        class="w-3.5 h-3.5"
                    ></i>

                    Central de Atendimento

                </div>


                <h1
                    class="
                        text-3xl
                        md:text-4xl
                        font-bold
                        tracking-tight
                    "
                >
                    Ordens de Serviço
                </h1>


                <p
                    class="
                        text-slate-500
                        mt-3
                        max-w-2xl
                    "
                >
                    Consulte, acompanhe e gerencie todas as ordens
                    de serviço dos seus clientes.
                </p>

            </div>



            <!-- VOLTAR -->

            <a
                href="../menu/index.html"
                class="
                    inline-flex
                    items-center
                    justify-center
                    gap-2
                    self-start
                    lg:self-auto
                    px-5
                    py-3
                    rounded-2xl
                    bg-[#111712]
                    border
                    border-[#29322C]
                    text-slate-300
                    hover:text-white
                    hover:border-green-500/40
                    hover:bg-[#151D17]
                    transition
                "
            >

                <i
                    data-lucide="arrow-left"
                    class="w-4 h-4"
                ></i>

                Voltar

            </a>

        </header>



        <!-- ===================================== -->
        <!-- FILTROS -->
        <!-- ===================================== -->

        <section
            class="
                bg-[#101510]/90
                border
                border-[#222B25]
                rounded-[28px]
                p-4
                md:p-5
                mb-8
                shadow-2xl
            "
        >

            <div
                class="
                    grid
                    grid-cols-1
                    lg:grid-cols-[1fr_220px_150px]
                    gap-3
                "
            >

                <!-- BUSCA -->

                <div class="relative">

                    <i
                        data-lucide="search"
                        class="
                            absolute
                            left-4
                            top-1/2
                            -translate-y-1/2
                            w-4
                            h-4
                            text-slate-600
                        "
                    ></i>


                    <input
                        id="searchInput"
                        type="text"
                        placeholder="Pesquisar cliente, aparelho ou OS..."
                        class="
                            w-full
                            bg-[#0B0F0C]
                            border
                            border-[#29322C]
                            rounded-2xl
                            pl-11
                            pr-4
                            py-3.5
                            text-sm
                            text-white
                            placeholder:text-slate-700
                            outline-none
                            focus:border-green-500/60
                            focus:ring-4
                            focus:ring-green-500/5
                            transition
                        "
                    >

                </div>



                <!-- STATUS -->

                <div class="relative">

                    <i
                        data-lucide="list-filter"
                        class="
                            absolute
                            left-4
                            top-1/2
                            -translate-y-1/2
                            w-4
                            h-4
                            text-slate-600
                            pointer-events-none
                        "
                    ></i>


                    <select
                        id="statusFilter"
                        class="
                            w-full
                            appearance-none
                            bg-[#0B0F0C]
                            border
                            border-[#29322C]
                            rounded-2xl
                            pl-11
                            pr-10
                            py-3.5
                            text-sm
                            text-slate-300
                            outline-none
                            focus:border-green-500/60
                            focus:ring-4
                            focus:ring-green-500/5
                            transition
                        "
                    >

                        <option value="">
                            Todos os status
                        </option>

                        <option value="Aberta">
                            Aberta
                        </option>

                        <option value="Aguardando aprovação">
                            Aguardando aprovação
                        </option>

                        <option value="Aguardando peça">
                            Aguardando peça
                        </option>

                        <option value="Em manutenção">
                            Em manutenção
                        </option>

                        <option value="Pronta">
                            Pronta
                        </option>

                        <option value="Entregue">
                            Entregue
                        </option>

                        <option value="Cancelada">
                            Cancelada
                        </option>

                    </select>


                    <i
                        data-lucide="chevron-down"
                        class="
                            absolute
                            right-4
                            top-1/2
                            -translate-y-1/2
                            w-4
                            h-4
                            text-slate-600
                            pointer-events-none
                        "
                    ></i>

                </div>



                <!-- ATUALIZAR -->

                <button
                    id="refreshButton"
                    type="button"
                    class="
                        inline-flex
                        items-center
                        justify-center
                        gap-2
                        rounded-2xl
                        bg-green-500
                        hover:bg-green-400
                        text-[#071009]
                        font-bold
                        px-5
                        py-3.5
                        transition
                        shadow-lg
                        shadow-green-500/5
                    "
                >

                    <i
                        data-lucide="refresh-cw"
                        class="w-4 h-4"
                    ></i>

                    Atualizar

                </button>

            </div>

        </section>



        <!-- ===================================== -->
        <!-- CABEÇALHO DA LISTA -->
        <!-- ===================================== -->

        <section
            class="
                flex
                flex-col
                sm:flex-row
                sm:items-center
                sm:justify-between
                gap-4
                mb-5
            "
        >

            <div>

                <p
                    class="
                        text-xs
                        uppercase
                        tracking-[0.18em]
                        text-green-400/70
                        font-semibold
                    "
                >
                    Operação
                </p>


                <h2
                    class="
                        text-2xl
                        font-bold
                        mt-1
                    "
                >
                    Ordens encontradas
                </h2>

            </div>


            <div
                class="
                    inline-flex
                    items-center
                    gap-3
                    self-start
                    sm:self-auto
                    px-4
                    py-2.5
                    rounded-2xl
                    bg-[#101510]
                    border
                    border-[#29322C]
                "
            >

                <span
                    class="
                        w-2
                        h-2
                        rounded-full
                        bg-green-400
                        shadow-[0_0_10px_rgba(34,197,94,.45)]
                    "
                ></span>


                <span
                    class="
                        text-sm
                        text-slate-400
                    "
                >
                    OS registradas
                </span>


                <span
                    id="ordersCount"
                    class="
                        min-w-8
                        text-center
                        text-sm
                        font-bold
                        text-white
                    "
                >
                    0
                </span>

            </div>

        </section>



        <!-- ===================================== -->
        <!-- LISTA -->
        <!-- ===================================== -->

        <div
            id="ordersContainer"
            class="
                grid
                grid-cols-1
                xl:grid-cols-2
                gap-5
            "
        ></div>

    </main>



    <!-- ========================================= -->
    <!-- MODAL EXCLUIR -->
    <!-- ========================================= -->

    <div
        id="deleteModal"
        class="
            fixed
            inset-0
            bg-black/75
            backdrop-blur-sm
            hidden
            items-center
            justify-center
            z-50
            p-4
        "
    >

        <div
            class="
                bg-[#111712]
                border
                border-[#29322C]
                rounded-[28px]
                w-full
                max-w-md
                p-8
                shadow-2xl
            "
        >

            <div class="text-center">

                <div
                    class="
                        w-16
                        h-16
                        mx-auto
                        mb-5
                        rounded-2xl
                        bg-red-500/10
                        border
                        border-red-500/15
                        flex
                        items-center
                        justify-center
                        text-red-400
                    "
                >

                    <i
                        data-lucide="trash-2"
                        class="w-7 h-7"
                    ></i>

                </div>


                <h2
                    class="
                        text-2xl
                        font-bold
                    "
                >
                    Excluir Ordem de Serviço
                </h2>


                <p
                    id="deleteText"
                    class="
                        text-slate-400
                        mt-4
                        leading-7
                    "
                >
                    Tem certeza?
                </p>

            </div>



            <div
                class="
                    flex
                    flex-wrap
                    justify-end
                    gap-3
                    mt-8
                "
            >

                <button
                    id="cancelDelete"
                    type="button"
                    class="
                        px-6
                        py-3
                        rounded-2xl
                        bg-[#202823]
                        hover:bg-[#29322C]
                        transition
                        text-slate-300
                    "
                >
                    Cancelar
                </button>


                <button
                    id="confirmDelete"
                    type="button"
                    class="
                        px-6
                        py-3
                        rounded-2xl
                        bg-red-600
                        hover:bg-red-500
                        transition
                        font-semibold
                    "
                >
                    Excluir
                </button>

            </div>

        </div>

    </div>



    <!-- ========================================= -->
    <!-- SCRIPTS -->
    <!-- ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/supabase.js"></script>
    <script src="../../assets/js/storage.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/bootstrap.js"></script>
    <script src="../../assets/js/roles.js"></script>

    <script src="index.js"></script>

    <script>
        lucide.createIcons();
    </script>

</body>

</html>

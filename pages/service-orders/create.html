<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <link
        rel="icon"
        type="image/png"
        href="../../assets/img/nekkologo_favicon.png"
    >

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Ordem de Serviço • Nekko OS</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body class="bg-[#0B0F0C] text-white min-h-screen">

<div class="max-w-6xl mx-auto px-8 py-10">

    <!-- HEADER -->

    <div class="flex items-center justify-between mb-10">

        <div>

            <a
                href="../menu/index.html"
                class="inline-flex items-center gap-2 text-slate-400 hover:text-green-400 transition mb-5">

                <i data-lucide="arrow-left" class="w-4 h-4"></i>

                Voltar

            </a>

            <h1 class="text-4xl font-bold">

                Nova Ordem de Serviço

            </h1>

            <p class="text-slate-500 mt-2">

                Preencha as informações abaixo.

            </p>

        </div>

    </div>

    <!-- FORM -->

    <form
        id="serviceOrderForm"
        class="space-y-8">

        <!-- CLIENTE -->

        <!-- CLIENTE -->

<section class="bg-[#141A16] border border-[#29322C] rounded-3xl p-8">

    <h2 class="text-xl font-semibold mb-6">

        👤 Cliente

    </h2>

    <div class="grid md:grid-cols-2 gap-5">

        <input
            id="customerName"
            type="text"
            placeholder="Nome completo"
            class="bg-[#0F1411] border border-[#29322C] rounded-xl p-3">

        <input
            id="customerPhone"
            type="text"
            placeholder="Telefone"
            class="bg-[#0F1411] border border-[#29322C] rounded-xl p-3">

        <input
            id="customerCpf"
            type="text"
            placeholder="CPF"
            class="bg-[#0F1411] border border-[#29322C] rounded-xl p-3">

        <input
            id="customerCep"
            type="text"
            placeholder="CEP"
            class="bg-[#0F1411] border border-[#29322C] rounded-xl p-3">

        <input
            id="customerAddress"
            type="text"
            placeholder="Endereço"
            class="md:col-span-2 bg-[#0F1411] border border-[#29322C] rounded-xl p-3">

        <input
            id="customerNumber"
            type="text"
            placeholder="Número"
            class="bg-[#0F1411] border border-[#29322C] rounded-xl p-3">

        <input
            id="customerNeighborhood"
            type="text"
            placeholder="Bairro"
            class="bg-[#0F1411] border border-[#29322C] rounded-xl p-3">

        <input
            id="customerCity"
            type="text"
            placeholder="Cidade"
            class="bg-[#0F1411] border border-[#29322C] rounded-xl p-3">

        <input
            id="customerState"
            type="text"
            placeholder="Estado"
            maxlength="2"
            class="bg-[#0F1411] border border-[#29322C] rounded-xl p-3">

        <input
            id="customerComplement"
            type="text"
            placeholder="Complemento (Opcional)"
            class="md:col-span-2 bg-[#0F1411] border border-[#29322C] rounded-xl p-3">

    </div>

</section>

        <!-- DISPOSITIVO -->

        <section class="bg-[#141A16] border border-[#29322C] rounded-3xl p-8">

            <h2 class="text-xl font-semibold mb-6">
                📱 Dispositivo
            </h2>

            <div class="grid md:grid-cols-2 gap-5">

                <select id="deviceType"
                    class="bg-[#0F1411] border border-[#29322C] rounded-xl p-3">

                    <option>Selecione o tipo</option>
                    <option>Smartphone</option>
                    <option>Notebook</option>
                    <option>Tablet</option>
                    <option>Smartwatch</option>
                    <option>Videogame</option>
                    <option>Desktop</option>
                    <option>Outro</option>

                </select>

                <input
                    id="brand"
                    type="text"
                    placeholder="Marca"
                    class="bg-[#0F1411] border border-[#29322C] rounded-xl p-3">

                <input
                    id="model"
                    type="text"
                    placeholder="Modelo"
                    class="bg-[#0F1411] border border-[#29322C] rounded-xl p-3">

                <input
                    id="imei"
                    type="text"
                    placeholder="IMEI / Número de Série (Opcional)"
                    class="bg-[#0F1411] border border-[#29322C] rounded-xl p-3">

            </div>

        </section>

        <!-- SEGURANÇA -->

        <section class="bg-[#141A16] border border-[#29322C] rounded-3xl p-8">

            <h2 class="text-xl font-semibold mb-6">
                🔒 Segurança
            </h2>

            <div class="grid md:grid-cols-2 gap-5">

                <select
                    id="lockType"
                    class="bg-[#0F1411] border border-[#29322C] rounded-xl p-3">

                    <option value="">Tipo de bloqueio</option>

                    <option value="none">Sem senha</option>
                    <option value="pin">PIN</option>
                    <option value="password">Senha</option>
                    <option value="pattern">Desenho</option>

                </select>

                <div id="lockField"></div>

            </div>

            <div
                id="patternContainer"
                class="hidden mt-8">

            </div>

        </section>

        <!-- SERVIÇOS -->

<section
    class="
        bg-[#141A16]
        border
        border-[#29322C]
        rounded-3xl
        p-8
    "
>

    <div
        class="
            flex
            items-center
            justify-between
            mb-6
        "
    >

        <div>

            <h2 class="text-xl font-semibold">
                🔧 Serviços
            </h2>

            <p class="text-sm text-slate-500 mt-1">
                Adicione todos os serviços realizados neste aparelho.
            </p>

        </div>

        <span
            id="serviceItemsCount"
            class="text-xs text-slate-500"
        >
            0 serviços
        </span>

    </div>


    <!-- ============================== -->
    <!-- NOVO SERVIÇO -->
    <!-- ============================== -->

    <div class="grid md:grid-cols-[1fr_180px_auto] gap-4">

        <div>

            <label
                for="service"
                class="
                    block
                    text-sm
                    font-medium
                    text-slate-300
                    mb-2
                "
            >
                Serviço
            </label>

            <input
                id="service"
                type="text"
                placeholder="Ex.: Troca de tela"
                class="
                    w-full
                    bg-[#0F1411]
                    border
                    border-[#29322C]
                    rounded-xl
                    p-3
                    outline-none
                    focus:border-green-500
                    transition
                "
            >

        </div>


        <div>

            <label
                for="price"
                class="
                    block
                    text-sm
                    font-medium
                    text-slate-300
                    mb-2
                "
            >
                Valor
            </label>

            <div class="relative">

                <span
                    class="
                        absolute
                        left-3
                        top-1/2
                        -translate-y-1/2
                        text-slate-500
                    "
                >
                    R$
                </span>

                <input
                    id="price"
                    type="text"
                    inputmode="decimal"
                    placeholder="0,00"
                    class="
                        w-full
                        bg-[#0F1411]
                        border
                        border-[#29322C]
                        rounded-xl
                        pl-11
                        pr-3
                        py-3
                        outline-none
                        focus:border-green-500
                        transition
                    "
                >

            </div>

        </div>


        <div
            class="
                flex
                items-end
            "
        >

            <button
                type="button"
                id="addServiceItem"
                class="
                    w-full
                    md:w-auto
                    px-5
                    py-3
                    rounded-xl
                    bg-white/5
                    border
                    border-[#29322C]
                    hover:border-green-500/50
                    hover:bg-white/10
                    transition
                    font-semibold
                    flex
                    items-center
                    justify-center
                    gap-2
                    whitespace-nowrap
                "
            >

                <i
                    data-lucide="plus"
                    class="w-4 h-4"
                ></i>

                Adicionar

            </button>

        </div>

    </div>


    <!-- ============================== -->
    <!-- LISTA DE SERVIÇOS -->
    <!-- ============================== -->

    <div
        id="serviceItemsContainer"
        class="hidden mt-8"
    >

        <div
            id="serviceItemsList"
            class="space-y-3"
        ></div>


        <!-- TOTAL -->

        <div
            class="
                flex
                items-center
                justify-between
                mt-5
                pt-5
                border-t
                border-[#29322C]
            "
        >

            <span
                class="
                    text-sm
                    text-slate-400
                "
            >
                Total dos serviços
            </span>

            <strong
                id="serviceTotal"
                class="
                    text-xl
                    font-bold
                    text-green-400
                "
            >
                R$ 0,00
            </strong>

        </div>

    </div>

</section>

        <!-- DIAGNÓSTICO -->

        <section class="bg-[#141A16] border border-[#29322C] rounded-3xl p-8">

            <h2 class="text-xl font-semibold mb-6">
                📝 Diagnóstico
            </h2>

            <div class="space-y-5">

                <textarea
                    id="problem"
                    rows="5"
                    placeholder="Defeito relatado..."
                    class="w-full bg-[#0F1411] border border-[#29322C] rounded-xl p-4 resize-none"></textarea>

                <textarea
                    id="notes"
                    rows="5"
                    placeholder="Observações internas..."
                    class="w-full bg-[#0F1411] border border-[#29322C] rounded-xl p-4 resize-none"></textarea>

            </div>

        </section>

        <!-- EXECUÇÃO -->

        <section class="bg-[#141A16] border border-[#29322C] rounded-3xl p-8">

            <h2 class="text-xl font-semibold mb-6">
                👨‍🔧 Execução
            </h2>

            <div class="grid md:grid-cols-2 gap-5">

                <select
                    id="technician"
                    class="bg-[#0F1411] border border-[#29322C] rounded-xl p-3">

                    <option>Selecione o técnico</option>

                </select>


                <select
                    id="orderType"
                    class="bg-[#0F1411] border border-[#29322C] rounded-xl p-3">
                
                    <option value="customer">
                        👤 Cliente
                    </option>
                
                    <option value="dealer">
                        🏪 Lojista
                    </option>
                
                </select>

                <select
                    id="status"
                    class="bg-[#0F1411] border border-[#29322C] rounded-xl p-3">

                    <option>Aberta</option>
                    <option>Aguardando aprovação</option>
                    <option>Aguardando peça</option>
                    <option>Em manutenção</option>
                    <option>Pronta</option>
                    <option>Entregue</option>
                    <option>Cancelada</option>

                </select>

            </div>

        </section>

        <!-- BOTÕES -->

        <div class="flex justify-end gap-4 pb-10">

            <a
                href="../menu/index.html"
                class="px-6 py-3 rounded-xl border border-[#29322C] hover:border-slate-500 transition">

                Cancelar

            </a>

            <button
                id="btnCreate"
                type="submit"
                class="px-8 py-3 rounded-xl bg-green-600 hover:bg-green-500 transition font-semibold">

                Salvar Ordem de Serviço

            </button>

        </div>

    </form>

</div>

<script>
    lucide.createIcons();
</script>

<!-- Config -->
<script src="../../assets/js/config.js"></script>

<!-- Core -->
<script src="../../assets/js/supabase.js"></script>
<script src="../../assets/js/storage.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/bootstrap.js"></script>

<!-- Página -->
<script src="./create.js"></script>

</body>
</html>

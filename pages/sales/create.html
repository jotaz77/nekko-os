<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <link
        rel="icon"
        type="image/png"
        href="../../assets/img/nekkologo_favicon.png"
    >

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Registrar Venda • NEKKO OS</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body class="bg-[#0B0F0C] text-white min-h-screen">

    <main class="max-w-3xl mx-auto px-6 py-10">

        <!-- VOLTAR -->

        <a
            href="../menu/index.html"
            class="
                inline-flex
                items-center
                gap-2
                text-slate-400
                hover:text-green-400
                transition
                mb-8
            ">

            <i
                data-lucide="arrow-left"
                class="w-4 h-4">
            </i>

            Voltar

        </a>


        <!-- CABEÇALHO -->

        <header class="mb-8">

            <div
                class="
                    flex
                    items-center
                    gap-4
                    mb-3
                ">

                <div
                    class="
                        w-12
                        h-12
                        rounded-2xl
                        bg-green-500/10
                        flex
                        items-center
                        justify-center
                    ">

                    <i
                        data-lucide="shopping-cart"
                        class="
                            w-6
                            h-6
                            text-green-400
                        ">
                    </i>

                </div>

                <h1 class="text-3xl font-bold">

                    Registrar Venda

                </h1>

            </div>

            <p class="text-slate-500">

                Registre uma venda realizada pela loja.

            </p>

        </header>


        <!-- FORMULÁRIO -->

        <section
            class="
                bg-[#141A16]
                border
                border-[#29322C]
                rounded-3xl
                p-6
                md:p-8
            ">

            <form id="saleForm">

                <!-- LOJA -->

                <div class="mb-6">
                
                    <label
                        for="store"
                        class="
                            block
                            text-sm
                            font-medium
                            text-slate-300
                            mb-2
                        "
                    >
                
                        Loja
                
                    </label>
                
                
                    <select
                        id="store"
                        class="
                            w-full
                            bg-[#0F1411]
                            border
                            border-[#29322C]
                            rounded-xl
                            px-4
                            py-3
                            outline-none
                            focus:border-green-500
                            transition
                        "
                    >
                
                    </select>
                
                
                    <p
                        id="storeHelp"
                        class="
                            text-xs
                            text-slate-500
                            mt-2
                        "
                    ></p>
                
                </div>
    
                <!-- PRODUTO -->

                <div class="mb-6">

                    <label
                        for="productName"
                        class="
                            block
                            text-sm
                            font-medium
                            text-slate-300
                            mb-2
                        ">

                        Produto

                    </label>

                    <div
                        class="relative"
                    >
                    
                        <input
                            id="productName"
                            type="text"
                            autocomplete="off"
                            placeholder="Digite o nome do produto"
                            class="
                                w-full
                                bg-[#0F1411]
                                border
                                border-[#29322C]
                                rounded-xl
                                px-4
                                py-3
                                outline-none
                                focus:border-green-500
                                transition
                            "
                        >
                    
                    
                        <!-- RESULTADOS DO ESTOQUE -->
                    
                        <div
                            id="productSuggestions"
                            class="
                                hidden
                                absolute
                                left-0
                                right-0
                                top-full
                                mt-2
                                z-50
                                bg-[#141A16]
                                border
                                border-[#29322C]
                                rounded-2xl
                                shadow-2xl
                                overflow-hidden
                            "
                        ></div>
                    
                    </div>
                </div>


                <!-- VALOR -->

                <div class="mb-6">

                    <label
                        for="salePrice"
                        class="
                            block
                            text-sm
                            font-medium
                            text-slate-300
                            mb-2
                        ">

                        Valor da venda

                    </label>

                    <div class="relative">

                        <span
                            class="
                                absolute
                                left-4
                                top-1/2
                                -translate-y-1/2
                                text-slate-500
                            ">

                            R$

                        </span>

                        <input
                            id="salePrice"
                            type="text"
                            inputmode="decimal"
                            autocomplete="off"
                            placeholder="0,00"
                            class="
                                w-full
                                bg-[#0F1411]
                                border
                                border-[#29322C]
                                rounded-xl
                                pl-12
                                pr-4
                                py-3
                                outline-none
                                focus:border-green-500
                                transition
                            ">

                    </div>

                </div>

                <!-- ADICIONAR PRODUTO -->

                <div class="mb-8">
                
                    <button
                        type="button"
                        id="addSaleItem"
                        class="
                            w-full
                            flex
                            items-center
                            justify-center
                            gap-2
                            bg-white/5
                            hover:bg-white/10
                            border
                            border-[#29322C]
                            hover:border-green-500/50
                            text-white
                            font-semibold
                            rounded-xl
                            py-3
                            transition
                        "
                    >
                
                        <i
                            data-lucide="plus"
                            class="w-5 h-5"
                        ></i>
                
                        Adicionar produto
                
                    </button>
                
                </div>

                <!-- ITENS DA VENDA -->

                <div
                    id="saleItemsContainer"
                    class="hidden mb-8"
                >
                
                    <div
                        class="
                            flex
                            items-center
                            justify-between
                            mb-4
                        "
                    >
                
                        <div>
                
                            <h3
                                class="
                                    text-sm
                                    font-semibold
                                    text-white
                                "
                            >
                
                                Itens da venda
                
                            </h3>
                
                
                            <p
                                class="
                                    text-xs
                                    text-slate-500
                                    mt-1
                                "
                            >
                
                                Produtos adicionados a esta venda.
                
                            </p>
                
                        </div>
                
                
                        <span
                            id="saleItemsCount"
                            class="
                                text-xs
                                text-slate-500
                            "
                        >
                
                            0 itens
                
                        </span>
                
                    </div>
                
                
                    <div
                        id="saleItemsList"
                        class="space-y-3"
                    ></div>
                
                
                    <!-- TOTAL -->
                
                    <div
                        class="
                            flex
                            items-center
                            justify-between
                            mt-5
                            pt-5
                            border-t
                            border-[#29322C]
                        "
                    >
                
                        <span
                            class="
                                text-sm
                                text-slate-400
                            "
                        >
                
                            Total da venda
                
                        </span>
                
                
                        <strong
                            id="saleTotal"
                            class="
                                text-xl
                                font-bold
                                text-green-400
                            "
                        >
                
                            R$ 0,00
                
                        </strong>
                
                    </div>
                
                </div>

                <!-- MÉTODO DE PAGAMENTO -->

                <div class="mb-8">
                
                    <label
                        for="paymentMethod"
                        class="
                            block
                            text-sm
                            font-medium
                            text-slate-300
                            mb-2
                        "
                    >
                
                        Método de pagamento
                
                    </label>
                
                
                    <select
                        id="paymentMethod"
                        required
                        class="
                            w-full
                            bg-[#0F1411]
                            border
                            border-[#29322C]
                            rounded-xl
                            px-4
                            py-3
                            outline-none
                            focus:border-green-500
                            transition
                        "
                    >
                
                        <option value="">
                            Selecione o método de pagamento
                        </option>
                
                        <option value="pix">
                            PIX
                        </option>
                
                        <option value="debit">
                            Débito
                        </option>
                
                        <option value="cash">
                            Dinheiro
                        </option>
                
                        <option value="credit_cash">
                            Crédito à vista
                        </option>
                
                        <option value="credit_installments">
                            Crédito parcelado
                        </option>
                
                    </select>
                
                </div>

                <!-- DADOS DO CLIENTE -->

                <div class="mt-6">
                
                    <div
                        class="
                            flex
                            items-center
                            justify-between
                            mb-4
                        "
                    >
                    
                        <label
                            for="enableCustomerInfo"
                            class="
                                flex
                                items-center
                                gap-3
                                cursor-pointer
                            "
                        >
                    
                            <input
                                type="checkbox"
                                id="enableCustomerInfo"
                                class="
                                    w-4
                                    h-4
                                    rounded
                                    border-[#29322C]
                                    bg-[#0F1411]
                                    text-green-500
                                    focus:ring-green-500
                                "
                            >
                    
                            <span
                                class="
                                    text-sm
                                    font-semibold
                                    text-white
                                "
                            >
                    
                                Informações do cliente
                    
                            </span>
                    
                        </label>
                    
                    
                        <span
                            class="
                                text-xs
                                text-slate-500
                            "
                        >
                    
                            Opcional
                    
                        </span>
                    
                    </div>

                    <div
                        id="customerFields"
                        class="hidden"
                    >
                
                
                    <!-- NOME -->
                
                    <div class="mb-4">
                
                        <label
                            for="customerName"
                            class="block text-sm text-slate-400 mb-2"
                        >
                            Nome do cliente
                        </label>
                
                        <input
                            type="text"
                            id="customerName"
                            placeholder="Nome completo"
                            class="
                                w-full
                                px-4
                                py-3
                                rounded-xl
                                bg-[#0F1411]
                                border
                                border-[#29322C]
                                text-white
                                outline-none
                                focus:border-green-500
                            "
                        >
                
                    </div>
                
                
                    <!-- CPF / CNPJ -->
                
                    <div class="mb-4">
                
                        <label
                            for="customerDocument"
                            class="block text-sm text-slate-400 mb-2"
                        >
                            CPF ou CNPJ
                        </label>
                
                        <input
                            type="text"
                            id="customerDocument"
                            placeholder="CPF ou CNPJ"
                            class="
                                w-full
                                px-4
                                py-3
                                rounded-xl
                                bg-[#0F1411]
                                border
                                border-[#29322C]
                                text-white
                                outline-none
                                focus:border-green-500
                            "
                        >
                
                    </div>
                
                
                    <!-- CEP -->
                
                    <div class="mb-4">
                
                        <label
                            for="customerZipCode"
                            class="block text-sm text-slate-400 mb-2"
                        >
                            CEP
                        </label>
                
                        <input
                            type="text"
                            id="customerZipCode"
                            placeholder="00000-000"
                            maxlength="9"
                            class="
                                w-full
                                px-4
                                py-3
                                rounded-xl
                                bg-[#0F1411]
                                border
                                border-[#29322C]
                                text-white
                                outline-none
                                focus:border-green-500
                            "
                        >
                
                    </div>
                
                </div>
                    
            </div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    id="submitSale"
                    class="
                        w-full
                        bg-green-500
                        hover:bg-green-600
                        text-black
                        font-semibold
                        rounded-xl
                        py-3
                        transition
                        flex
                        items-center
                        justify-center
                        gap-2
                    ">

                    <i
                        data-lucide="check"
                        class="w-5 h-5">
                    </i>

                    Registrar Venda

                </button>

            </form>

        </section>


        <!-- MENSAGEM -->

        <div
            id="message"
            class="
                hidden
                mt-5
                rounded-xl
                px-4
                py-3
                text-sm
            ">
        </div>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- CORE -->

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/supabase.js"></script>
    <script src="../../assets/js/storage.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/bootstrap.js"></script>
    <script src="../../assets/js/roles.js"></script>

    <!-- PÁGINA -->

    <script src="./create.js"></script>

</body>

</html>

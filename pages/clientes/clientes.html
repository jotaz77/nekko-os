<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <link
        rel="icon"
        type="image/png"
        href="../../assets/img/nekkologo_favicon.png"
    >
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes • Nekko OS</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/supabase.js"></script>
</head>

<body class="bg-slate-100">

<div class="max-w-7xl mx-auto p-8">

    <div class="flex justify-between items-center mb-8">

        <h1 class="text-3xl font-bold">
            Clientes
        </h1>

        <button
            id="btnNovo"

            class="bg-blue-600 text-white px-5 py-3 rounded-xl">

            Novo Cliente

        </button>

    </div>

    <div class="bg-white rounded-2xl shadow">

        <table class="w-full">

            <thead>

            <tr class="border-b">

                <th class="text-left p-4">Nome</th>
                <th class="text-left p-4">Telefone</th>
                <th class="text-left p-4">WhatsApp</th>
                <th class="text-left p-4"></th>

            </tr>

            </thead>

            <tbody id="clientesTable">

            </tbody>

        </table>

    </div>

</div>

<script src="clientes.js"></script>

</body>
</html>

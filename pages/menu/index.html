<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nekko OS</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body class="bg-[#0B0F0C] text-white min-h-screen">

<div class="max-w-7xl mx-auto px-8 py-10">

    <!-- HEADER -->

    <header class="flex items-start justify-between mb-12">

        <div>

            <h1 class="text-4xl font-bold tracking-wide">
                NEKKO <span class="text-green-500">OS</span>
            </h1>

            <p class="text-slate-500 mt-2">
                Sistema de Gestão para Assistências Técnicas
            </p>

            <!-- Modo -->

            <div class="flex items-center gap-3 mt-5">

                <span
                    id="modeBadge"
                    class="hidden
                           px-3
                           py-1
                           rounded-full
                           border
                           border-green-500/30
                           bg-green-500/10
                           text-green-400
                           text-xs
                           font-semibold
                           uppercase
                           tracking-wider">

                </span>

            </div>

        </div>

        <div class="text-right">

            <h2
                id="userName"
                class="text-base font-medium text-slate-400">
        
                Usuário
        
            </h2>
        
        </div>

    </header>


    <!-- LOJA ATUAL -->

    <section class="mb-10 text-center">
    
        <p class="text-slate-500 text-sm tracking-[3px] uppercase">
    
            Loja Atual
    
        </p>
    
        <h2
            id="currentStore"
            class="text-3xl font-bold mt-2">
    
            Carregando...
    
        </h2>
    
    </section>
    
    <!-- MENU -->

    <section>

        <h3 class="text-lg font-semibold mb-6 text-slate-300">

            Módulos

        </h3>

        <div
            id="menuGrid"
            class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6">

        </div>

    </section>

    <footer class="text-center mt-20 mb-6">

        <p
            class="text-slate-700
                   uppercase
                   tracking-[12px]
                   text-sm
                   select-none">
    
            NEKKO OS
    
        </p>
    
    </footer>

</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Configuração -->
<script src="../../assets/js/config.js"></script>

<!-- Cliente Supabase -->
<script src="../../assets/js/supabase.js"></script>

<!-- Serviços -->
<script src="../../assets/js/storage.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/bootstrap.js"></script>
<script src="../../assets/js/roles.js"></script>

<!-- Página -->
<script src="index.js"></script>

<script>
    lucide.createIcons();
</script>

</body>

</html>
